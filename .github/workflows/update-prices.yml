name: Aggiorna prezzi benzina

on:
  workflow_dispatch:          # ← pulsante "Run workflow" (lo lanci a mano quando vuoi)
  schedule:
    - cron: "17 6 * * *"      # ogni giorno alle 06:17 UTC (evita il minuto :00 congestionato)

permissions:
  contents: write             # serve per ricommittare prices.json

concurrency:                  # niente run sovrapposte
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install requests

      - name: Aggiorna prezzi
        run: python scripts/update_prices.py

      - name: Commit e push (se cambiato qualcosa)
        run: |
          git config user.name  "caponord-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --staged --quiet; then
            echo "Nessuna variazione di prezzo: niente commit."
          else
            git commit -m "Aggiorna prezzi benzina ($(date -u +%F))"
            git push
          fi
